6px;font-size:clamp(20px,2vw,28px);line-height:1.32;letter-spacing:-.025em}.diagram{display:flex;align-items:stretch;gap:12px;flex:1;min-height:0}.diagram-step{flex:1;min-width:0;background:#f3f3f3;border-radius:18px;padding:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center}.diagram-step .column-title,.diagram-step .column-body{font-size:clamp(20px,2vw,28px);line-height:1.28}.diagram-arrow{width:30px;flex:none;display:grid;place-items:center;font-size:28px}.quote{flex:1;min-height:0;background:var(--quote);padding:32px 38px;border-radius:20px;overflow:auto;display:flex;align-items:flex-start}.quote-text{font-size:clamp(17px,1.55vw,22px);line-height:1.4;letter-spacing:-.018em;white-space:pre-wrap}.controls{position:fixed;right:18px;bottom:16px;display:flex;align-items:center;gap:10px;font:16px Helvetica,Arial,sans-serif}.controls button{width:42px;height:42px;background:#fff;color:#000;border:1px solid #000;border-radius:50%;font:24px Helvetica,Arial,sans-serif;cursor:pointer}.controls button:focus-visible{outline:2px solid #000;outline-offset:3px}.counter{min-width:58px;text-align:center}.progress{position:fixed;left:0;bottom:0;height:3px;background:#000;transition:width .2s ease}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

<script>
const mainSlides=[{"type": "cover", "title": "Кликабельные прототипы через Codex", "body": "От экранов продукта — к сценарию, который можно пройти в браузере"}, {"type": "body", "title": "Кликабельный прототип", "body": "Интерактивная версия интерфейса, в которой можно пройти пользовательский сценарий до разработки.\n\nПомогает обсуждать логику и проверять, насколько понятен путь пользователя."}, {"type": "columns", "title": "Зачем нужен прототип", "columns": [["Проверить", "Понятность интерфейса\nНавигацию и структуру\nОсновные гипотезы"], ["Обсудить", "Пользовательские сценарии\nОжидаемые состояния\nРешение до начала разработки"]]}, {"type": "screenshot", "title": "Редактируемый макет по скриншоту", "body": "Скриншот превращается в макет из отдельных редактируемых элементов. Композицию и иерархию можно уточнять вручную.", "placeholder": "Пример прототипа в Pixso", "image": "https://app.paper.design/file-assets/01M6NCFMMH195Z78YJ8H6104K6/01M6NE22G369T89KHMQSJFYJGH.png", "imageAlt": "Скриншот из макета Paper"}, {"type": "body", "title": "Когда сценарий разрастается", "body": "Каждый экран и состояние нужно готовить отдельно.\n\nИзменения требуют ручной работы с макетами и переходами.\n\nУчастник может ожидать реакцию от элемента, который не подключён."}, {"type": "body", "title": "Интерфейс как веб-страница", "body": "ИИ помогает собрать HTML-интерфейс по макету или изображению. Его можно открыть в браузере, описать поведение элементов и постепенно развивать сценарий."}, {"type": "columns", "title": "Возможности и ограничения", "columns": [["Возможности", "Больше сценариев и состояний\nДемо-контент и поведение\nБыстрые итерации"], ["Ограничения", "Результат нужно проверять\nВнешние сервисы и подписки\nПравила работы с данными"]]}, {"type": "screenshot", "title": "Рабочий кейс", "body": "Собираю прототип модуля инициатив: от экранов продукта — к сценарию для пользовательской проверки.", "placeholder": "Задача и контекст кейса", "image": "https://app.paper.design/file-assets/01M6NCFMMH195Z78YJ8H6104K6/01M6NE4YJS8TZ0JHTWWYFSNAGM.png", "imageAlt": "Скриншот из макета Paper"}, {"type": "assignment", "title": "Задание для пользователя", "sections": [{"heading": "Вступление для участника", "text": "Сегодня мы проверим прототип работы с инициативами. Представьте, что вы работаете с портфелем инициатив: некоторые нужно отправить на согласование, а новую инициативу — добавить и связать с уже существующей."}, {"heading": "Задание 1. Массово сменить статус", "text": "В списке инициатив выберите любые три инициативы, которые, по вашему мнению, готовы перейти к согласованию. Измените их статус так, чтобы они были отправлены на согласование. Когда закончите, расскажите, как вы поняли, что действие применилось ко всем трём инициативам."}, {"heading": "Задание 2. Создать и объединить инициативу", "text": "Команда хочет запустить инициативу по сокращению времени обработки клиентских обращений. Создайте для неё новую инициативу, заполнив обязательные поля так, как считаете нужным. После создания объедините её с существующей инициативой «Автоматизация обработки заявок». Когда закончите, расскажите, как вы проверили, что новая инициатива создана и связана с нужной существующей инициативой."}]}, {"type": "steps", "title": "Подготовка экранов", "items": ["Выбрать ключевые экраны продукта", "При необходимости обезличить данные", "Сохранить изображения в PNG"], "placeholder": "Исходные экраны продукта", "image": "https://app.paper.design/file-assets/01M6NCFMMH195Z78YJ8H6104K6/01M6NF3ADX6WRMZWCASQHPSKVS.png", "imageAlt": "Скриншот из макета Paper"}, {"type": "columns", "title": "Два шага к прототипу", "columns": [["Paper", "Воссоздать редактируемый визуальный ориентир по скриншоту."], ["React / Vite", "Собрать отдельный HTML-прототип, перенеся структуру и поведение макета."]]}, {"type": "body", "title": "Paper — визуальный ориентир", "body": "В Paper воссоздаём макет, который можно редактировать. Интерактивный прототип собираем отдельно в локальном проекте на React/Vite, перенося туда структуру и поведение.", "image": "https://app.paper.design/file-assets/01M6NCFMMH195Z78YJ8H6104K6/01M6NF67H3G6Z6X3GASWDCPWJT.png", "imageAlt": "Скриншот из макета Paper"}, {"type": "steps", "title": "Поведение и визуальная доводка", "items": ["Добавить состояния и сценарии", "Подключить компоненты SDDS FinAI", "Сверить браузер со скриншотом и исправить расхождения"], "placeholder": "Прототип в браузере", "image": "assets/paper-prototype-overview.png", "imageAlt": "Скриншот макета Paper с двумя вариантами модуля инициатив"}, {"type": "diagram", "title": "Как изменения доходят до пользователей", "items": [["Пишешь код", "Codex / VS Code"], ["Commit", "Сохраняешь версию проекта"], ["Push", "Отправляешь изменения на GitHub"], ["Deploy", "GitHub Pages обновляет сайт"]]}, {"type": "body", "title": "Цикл проверки", "body": "Создать → посмотреть в браузере → сравнить со скриншотом → исправить конкретное расхождение.\n\nТак макет, компоненты и поведение проверяются на реальном результате, а не только по генерации ИИ."}];
const promptSlides=[{"number": 1, "title": "Воссоздать редактируемый макет по скриншоту в Paper", "text": "Воссоздай редактируемый макет интерфейса по загруженному скриншоту. Сохрани исходные пропорции и размер кадра, композицию, расположение элементов, отступы, размеры, цвета, типографику и визуальную иерархию.\n\nСобери интерфейс из отдельных редактируемых слоёв и компонентов: текст, кнопки, поля, карточки, иконки, таблица, заголовки и панели должны редактироваться независимо. Сохрани взаимное расположение элементов и структуру групп, чтобы макет было удобно уточнять вручную.\n\nНе добавляй элементы и состояния, которых нет на скриншоте. Если часть текста или детали неразборчива, аккуратно приблизь её по контексту и отметь для ручной проверки. Сначала добейся максимального визуального сходства с исходником, не переосмысливая дизайн."}, {"number": 2, "title": "Перенести макет в кликабельный HTML-прототип", "text": "По макету Paper и исходному скриншоту собери кликабельный HTML-прототип модуля инициатив. Перед началом изучи текущую структуру проекта и доступную библиотеку компонентов. Не начинай с новой страницы или отдельного демонстрационного стенда — интегрируй экран в существующий локальный проект.\n\nПеренеси основную структуру: верхнюю навигацию, заголовок, вкладки, фильтры, сводные показатели, таблицу инициатив, панель действий для выбранных строк и кнопку создания. Сохрани пропорции и визуальные свойства макета.\n\nПодключай реальные компоненты UI-библиотеки, включая их интерактивность. Не подменяй их декоративными HTML-элементами с похожим видом. Кнопки, чекбоксы и меню должны реагировать на действия пользователя.\n\nПосле реализации открой страницу в браузере, проверь, что компоненты видны и работают, затем сравни результат со скриншотом. Исправь расхождения до передачи результата."}, {"number": 3, "title": "Добавить состояния массовых действий", "text": "Реализуй состояния массовых действий над инициативами по приложенным скриншотам:\n\n1. Когда пользователь нажимает «Выбрать действие», покажи состояние загрузки на 1–2 секунды, пока имитируется запрос к серверу. На это время кнопку нужно заблокировать и показать индикатор.\n2. После успешного действия покажи уведомление об успехе.\n3. Вложенные меню действий должны открываться непосредственно над панелью выбранных строк, с отступом 4 px, и позиционироваться относительно кнопки «Выбрать действие».\n4. При массовой смене статуса покажи постоянное уведомление о ходе операции с количеством инициатив. Оно не должно исчезать автоматически, пока операция выполняется; после завершения замени его уведомлением об успехе.\n\nСверяй положение и размеры меню и уведомлений со скриншотами. Не двигай панель выбранных строк и не меняй остальную композицию. Если реального API нет, обозначь операцию как локальную симуляцию и не представляй её как запрос к настоящему серверу."}, {"number": 4, "title": "Подключить SDDS FinAI", "text": "Переведи интерфейс на библиотеку SDDS FinAI: `@salutejs/sdds-finai`. Используй документацию и Storybook SDDS FinAI, чтобы подобрать подходящие компоненты и их свойства.\n\nДля кнопок, чекбоксов, переключателей, выпадающих списков, текстовых полей, многострочного ввода и уведомлений импортируй компоненты библиотеки напрямую. Не создавай самодельные замены для компонентов, которые уже есть в SDDS.\n\nПеред использованием проверь фактические API и свойства компонентов по документации, а после интеграции проверь их в браузере. Убедись, что состояния открытия, выбора, загрузки, disabled и уведомлений действительно работают.\n\nЕсли стандартное оформление SDDS отличается от макета, сначала оставь компонент SDDS, затем настрой его размер, отступы, цвета и поверхность локальными стилями. Не меняй внешний вид всей страницы ради того, чтобы автоматически подогнать её под библиотечную тему."}, {"number": 5, "title": "Выровнять визуальный стиль библиотеки с исходным макетом", "text": "Сравни текущую страницу в браузере с исходным скриншотом и макетом Paper. После подключения библиотеки некоторые компоненты стали выглядеть иначе, поэтому доведи интерфейс до близкого визуального соответствия исходнику.\n\nСохрани реальные компоненты SDDS там, где важны их поведение и доступность: кнопки, чекбоксы, переключатели, поля и списки. Настрой локальные стили компонентов так, чтобы совпали высота, ширина, отступы, радиусы, цвета, границы и типографика из макета.\n\nНе заменяй весь экран стилями библиотеки и не делай общий редизайн. Не удаляй работающие взаимодействия. Вноси изменения локально в те компоненты, которые визуально расходятся с референсом.\n\nПроверяй результат в браузере на сопоставимом размере экрана. Исправляй конкретные заметные отличия по одному: положение, размер, переполнение текста, иконки и состояние выбора."}, {"number": 6, "title": "Довести шапку, заголовок и панель вкладок", "text": "Доведи шапку и верхний блок страницы до приложенного скриншота. Сохрани три группы навигации: логотип и сервисы слева, основные ссылки по центру, системные действия и профиль справа.\n\nЗамени текстовые символы и случайные Unicode-знаки на аккуратные контурные иконки, соответствующие смыслу действия: поиск, календарь, помощь, сообщения, уведомления, меню, фильтр, сброс и предупреждения. Иконки должны иметь согласованные толщину линий, размер и выравнивание. Добавь индикатор непрочитанных уведомлений и стрелку у профиля, если они есть в референсе.\n\nУменьши заголовок до размера на скриншоте. У вкладки «Инициативы» задай белый фон активного состояния. Удали переключатель роли, которого нет в референсе.\n\nНе трогай остальные области страницы. После изменения проверь расположение групп и выравнивание иконок в браузере."}, {"number": 7, "title": "Довести таблицу, версии и переполнение текста", "text": "Доведи таблицу инициатив до приложенного референса. Добавь тонкие вертикальные разделители между колонками, сохрани их ширину и порядок, а также нижнюю фиксированную строку итогов.\n\nЗамени одинаковые названия инициатив на разные осмысленные примеры. Добавь колонку «Версия» и назначь строкам значения «БП» и «ПГК». Значения показывай обычным текстом без цветных плашек. Переключатель «Показать БП» должен фильтровать таблицу и оставлять только строки с версией «БП».\n\nДлинные названия инициатив и статусы не должны заходить на соседние колонки. Ограничивай текст шириной его ячейки и показывай многоточие при переполнении.\n\nСохрани правую полосу настроек шириной 56 px и оставь шестерёнку в ней. Не расширяй эту область. Иконку поиска размести штатным слотом компонента SDDS TextField, чтобы она не пересекалась с плейсхолдером.\n\nПроверь таблицу с короткими и длинными названиями, разными статусами и включённым фильтром БП."}, {"number": 8, "title": "Добавить отдельную страницу создания инициативы", "text": "По приложенному скриншоту создай отдельную страницу «Создание инициативы», которая открывается по кнопке «Создать инициативу» из таблицы. Не показывай форму в модальном окне. Поля при первом открытии должны быть пустыми, даже если на референсе они заполнены.\n\nСохрани структуру скриншота: верхний заголовок и подпись; большая белая карточка раздела «Общее»; переключатель «Неактуальная инициатива»; многострочные поля названия и описания со счётчиками символов; селекты версии, направления ПАО, аналитики ПАО, степени цифровизации, блока, трайба, трайба-1, продукта и команды.\n\nНиже добавь панель «Ключевой результат» с селектом метрики и полями Q1, Q2, Q3, Q4 и «Год». Добавь секцию «Структура аналитик блока» с селектами направления блока, направления трайба, стрима и аналитики. Внизу справа размести кнопки «Закрыть» и «Создать».\n\nИспользуй компоненты SDDS FinAI: TextArea для длинного текста, Select для выпадающих полей, TextField для числовых значений, Switch для переключателя. Покажи обязательность полей, добавь базовую проверку перед созданием и сохрани заполненные данные вместе с новой инициативой. Кнопка возврата должна вести к таблице."}, {"number": 9, "title": "Следующий этап — режим просмотра карточки", "text": "Реализуй режим просмотра карточки инициативы по приложенному скриншоту. При нажатии на строку таблицы открывай отдельную страницу выбранной инициативы и показывай её сохранённые данные.\n\nСохрани структуру референса: заголовок с названием инициативы, типом и текущим статусом; идентификатор; действия в верхней части страницы; вкладки «Общее», «Затраты», «Эффекты»; карточки периода, версии, оценки и автора; блок показателей; ключевой результат с квартальными значениями; подробную информацию; дополнительные аналитические поля; связи инициативы; вертикальную шкалу статусов и согласований справа.\n\nКнопка «Редактировать» должна открыть ту же форму создания, заполненную данными выбранной инициативы. После сохранения изменений верни пользователя в режим просмотра и покажи обновлённые значения. Кнопка возврата ведёт обратно в таблицу.\n\nПодключи режим просмотра к той же модели данных, что и таблицу и форму. Не используй отдельные хардкодные примеры для карточки. Если у инициативы поле не заполнено, показывай нейтральное состояние «Не заполнено». Проверяй карточку на данных, созданных через форму."}];

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(s){let inner='';
 if(s.type==='cover')inner=`<h1>${esc(s.title)}</h1><div class="body">${esc(s.body)}</div>`;
 else if(s.type==='body')inner=`<h1>${esc(s.title)}</h1><div class="body body-block">${esc(s.body)}</div>`;
 else if(s.type==='columns')inner=`<h1>${esc(s.title)}</h1><div class="columns">${s.columns.map(c=>`<div class="column"><div class="column-title">${esc(c[0])}</div><div class="column-body">${esc(c[1])}</div></div>`).join('')}</div>`;
 else if(s.type==='screenshot'){const media=s.image?`<figure class="image-frame"><img class="paper-image" src="${esc(s.image)}" alt="${esc(s.imageAlt||s.title)}" loading="eager"></figure>`:`<div class="placeholder"><div class="body">МЕСТО ДЛЯ СКРИНШОТА<br>${esc(s.placeholder)}</div></div>`;inner=`<h1>${esc(s.title)}</h1><div class="screenshot-layout"><div class="body">${esc(s.body)}</div>${media}</div>`;}
 else if(s.type==='split')inner=`<h1>${esc(s.title)}</h1><div class="split"><div class="split-copy"><div class="body">${esc(s.body)}</div></div><div class="split-visual"><div class="body">МЕСТО ДЛЯ СКРИНШОТА<br>${esc(s.placeholder)}</div></div></div>`;
 else if(s.type==='fullimage')inner=`<img class="full-image" src="${esc(s.image)}" alt="${esc(s.alt||s.title)}">`;
 else if(s.type==='assignment')inner=`<div class="assignment-layout"><div class="assignment-title"><h1>${esc(s.title)}</h1></div><div class="assignment-panel">${s.sections.map(x=>`<div class="assignment-section"><strong>${esc(x.heading)}</strong><br>${esc(x.text)}</div>`).join('')}</div></div>`;
 else if(s.type==='steps'){const media=s.image?`<figure class="image-frame"><img class="paper-image" src="${esc(s.image)}" alt="${esc(s.imageAlt||s.title)}" loading="eager"></figure>`:`<div class="placeholder"><div class="body">МЕСТО ДЛЯ СКРИНШОТА<br>${esc(s.placeholder)}</div></div>`;inner=`<h1>${esc(s.title)}</h1><div class="steps">${s.items.map(x=>`<div class="step">${esc(x)}</div>`).join('')}</div>${media}`;}
 else if(s.type==='diagram')inner=`<h1>${esc(s.title)}</h1><div class="diagram">${s.items.map((x,i)=>`${i?'<div class="diagram-arrow" aria-hidden="true">→</div>':''}<div class="diagram-step"><div class="column-title">${esc(x[0])}</div><div class="column-body">${esc(x[1])}</div></div>`).join('')}</div>`;
 else if(s.type==='quote')inner=`<h1>${esc(s.title)}</h1><blockquote class="quote"><div class="quote-text">${esc(s.body)}</div></blockquote>`;
 return `<section class="slide ${s.type==='cover'?'cover':''} ${s.type==='fullimage'?'fullimage':''}" aria-label="${esc(s.title)}">${inner}</section>`}
const stage=document.querySelector('#stage');stage.innerHTML=slides.map(render).join('');const nodes=[...stage.querySelectorAll('.slide')];let current=0;
function show(n){current=Math.max(0,Math.min(nodes.length-1,n));nodes.forEach((x,i)=>x.classList.toggle('active',i===current));document.querySelector('#counter').textContent=`${String(current+1).padStart(2,'0')} / ${String(nodes.length).padStart(2,'0')}`;document.querySelector('#progress').style.width=`${(current+1)/nodes.length*100}%`;history.replaceState(null,'',`#${current+1}`)}
document.querySelector('#prev').onclick=()=>show(current-1);document.querySelector('#next').onclick=()=>show(current+1);document.querySelector('#full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();document.addEventListener('keydown',e=>{if(['ArrowRight',' ','PageDown'].includes(e.key)){e.preventDefault();show(current+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(current-1)}if(e.key==='Home')show(0);if(e.key==='End')show(nodes.length-1)});const initial=Number(location.hash.slice(1));if(Number.isInteger(initial)&&initial>0)show(initial-1);else show(0);
